name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit, app version or URL where it happened.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, device, runtime version — whatever applies.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
